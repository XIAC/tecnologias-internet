
<section >

    <header >
        <h3>Nuestros productos</h3>
        <p>Adquiere nuestros productos de alta calidad</p>
    </header>

    <div class="container">
        <div class="row justify-content-md-center">
            <div class="col">
                    @for (p of productos; track p.id) {
                        <app-tarjeta-producto
                            [producto]="p"
                            (agregar)="agregarCompra($event)">
                        </app-tarjeta-producto>
                    }
            </div>
        </div>
        

    </div>


    <div >
        <app-detalle-compra
            [cantidad]="cantidad()"
            [total]="total()"
            (limpiar)="vaciar()">
        </app-detalle-compra>
    </div>

    @if (mensaje()) {
        <div class="mensaje-compra">
            <p>{{ mensaje() }}</p>
        </div>
    }

</section>
